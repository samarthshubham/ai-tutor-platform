<a class="skip-link" href="#main-content">Skip to main content</a>

@if (auth.user(); as user) {
<mat-toolbar class="top-bar">
  <button
    matIconButton
    type="button"
    aria-label="Toggle navigation"
    aria-controls="side-navigation"
    [attr.aria-expanded]="navigationOpen()"
    (click)="toggleNavigation()"
  >
    <mat-icon aria-hidden="true">menu</mat-icon>
  </button>
  <span class="app-name">AI Tutor</span>
  <span class="spacer"></span>
  <button
    matButton
    type="button"
    class="user-menu-button"
    data-testid="user-menu"
    [matMenuTriggerFor]="userMenu"
  >
    <mat-icon aria-hidden="true">account_circle</mat-icon>
    {{ user.displayName }}
  </button>
  <mat-menu #userMenu="matMenu">
    <p class="menu-role" data-testid="user-role">{{ roleLabel() }}</p>
    <button mat-menu-item type="button" (click)="auth.logout()">
      Sign out
    </button>
  </mat-menu>
</mat-toolbar>

<mat-sidenav-container class="layout">
  <mat-sidenav
    id="side-navigation"
    mode="side"
    [opened]="navigationOpen()"
    class="side-navigation"
  >
    <mat-nav-list aria-label="Main navigation">
      @for (item of navigation(); track item.path) {
      <a
        mat-list-item
        [routerLink]="item.path"
        routerLinkActive
        #active="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: true }"
        [activated]="active.isActive"
        [attr.aria-current]="active.isActive ? 'page' : null"
      >
        {{ item.label }}
      </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <main id="main-content" class="content" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
} @else {
<main id="main-content" class="content" tabindex="-1">
  @if (auth.error(); as error) {
  <tp-error-banner [error]="error" (retry)="reload()" />
  } @else {
  <tp-loading label="Checking your session…" />
  }
</main>
}
