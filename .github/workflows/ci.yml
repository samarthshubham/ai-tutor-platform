name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      frontend: ${{ steps.areas.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect which apps changed
        id: areas
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/changed-areas.sh

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test the workflow scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tutor-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check formatting
        run: ./mvnw -B spotless:check

      - name: Build, test and measure coverage
        run: ./mvnw -B verify

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse('target/site/jacoco/jacoco.xml').getroot()
          line = next(c for c in root.findall('counter') if c.get('type') == 'LINE')
          missed, covered = int(line.get('missed')), int(line.get('covered'))
          print(f"### Backend line coverage: {covered / (missed + covered):.1%} ({covered}/{missed + covered})")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: tutor-api/target/site/jacoco/

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tutor-web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tutor-web/package-lock.json

      - run: npm ci

      - name: Check formatting
        run: npx nx format:check --base="origin/${{ github.base_ref || 'main' }}"

      - name: Lint
        run: npx nx run-many -t lint --max-warnings=0

      - name: Test with coverage
        run: npx nx run-many -t test --coverage --watch=false

      - name: Build
        run: npx nx run-many -t build

      - name: Merge coverage reports
        if: always()
        run: |
          mkdir -p coverage-merged
          find coverage -name lcov.info | while read -r report; do
            project=$(dirname "${report#coverage/}")
            root=$(npx nx show project "$(basename "$project")" --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["root"])')
            sed "s|^SF:|SF:tutor-web/$root/|; s|^SF:tutor-web/$root/$root/|SF:tutor-web/$root/|" "$report" >> coverage-merged/lcov.info
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: tutor-web/coverage-merged/lcov.info
          if-no-files-found: ignore

  coverage-gate:
    if: github.event_name == 'pull_request' && !cancelled()
    needs: [changes, scripts, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Upstream jobs must not have failed
        if: contains(needs.*.result, 'failure')
        run: |
          echo "::error::changes=${{ needs.changes.result }} scripts=${{ needs.scripts.result }} backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }}"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: pip install diff-cover

      - uses: actions/download-artifact@v4
        if: needs.backend.result == 'success'
        with:
          name: backend-coverage
          path: reports/backend

      - name: Backend changed lines must be at least 80% covered
        if: needs.backend.result == 'success'
        run: |
          status=0
          diff-cover reports/backend/jacoco.xml --src-roots tutor-api/src/main/java \
            --compare-branch="origin/${{ github.base_ref }}" --fail-under=80 \
            --format markdown:backend.md || status=1
          { echo "## Backend changed-line coverage"; cat backend.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/download-artifact@v4
        if: needs.frontend.result == 'success'
        with:
          name: frontend-coverage
          path: reports/frontend

      - name: Frontend changed lines must be at least 80% covered
        if: needs.frontend.result == 'success' && hashFiles('reports/frontend/lcov.info') != ''
        run: |
          status=0
          diff-cover reports/frontend/lcov.info \
            --compare-branch="origin/${{ github.base_ref }}" --fail-under=80 \
            --format markdown:frontend.md || status=1
          { echo "## Frontend changed-line coverage"; cat frontend.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Note skipped areas
        if: needs.backend.result != 'success' || needs.frontend.result != 'success'
        run: |
          [ "${{ needs.backend.result }}" = success ] || echo "Backend: skipped, no backend changes." >> "$GITHUB_STEP_SUMMARY"
          [ "${{ needs.frontend.result }}" = success ] || echo "Frontend: skipped, no frontend changes." >> "$GITHUB_STEP_SUMMARY"
